<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071a2d">
  <title>Bake Time Calculator</title>
  <style>
    :root{color-scheme:dark;--bg:#061422;--card:#0d2438;--card2:#12314a;--text:#f4f8fb;--muted:#a9bfd0;--accent:#58d5c9;--accent2:#21aa9e;--line:#25465f;--danger:#ffbd73}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -10%,#164566 0,var(--bg) 42%);color:var(--text)}
    main{width:min(100%,560px);margin:auto;padding:max(22px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom))}
    header{text-align:center;margin:8px 0 22px}.icon{font-size:42px;line-height:1}h1{font-size:clamp(27px,7vw,38px);margin:8px 0 6px;letter-spacing:-.04em}header p{margin:0;color:var(--muted)}
    .card{background:linear-gradient(145deg,rgba(18,49,74,.98),rgba(10,32,50,.98));border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 18px 45px rgba(0,0,0,.28)}
    label,.label{display:block;font-size:13px;font-weight:750;color:#c2d3df;letter-spacing:.04em;text-transform:uppercase;margin:0 0 8px}.field{margin-bottom:18px}
    input,select,button{font:inherit}input,select{width:100%;height:52px;border-radius:14px;border:1px solid var(--line);background:#081b2b;color:var(--text);padding:0 13px;font-size:18px;outline:none}input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(88,213,201,.16)}
    .time-grid{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:9px}.duration-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .quick{display:flex;gap:8px;overflow:auto;padding-bottom:2px;margin-top:9px}.quick button{flex:0 0 auto;border:1px solid var(--line);background:#102c43;color:#d8e6ee;padding:9px 13px;border-radius:999px;font-weight:700}
    .calculate{width:100%;border:0;border-radius:16px;min-height:56px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#03201e;font-size:19px;font-weight:850;box-shadow:0 9px 22px rgba(33,170,158,.24)}.calculate:active{transform:translateY(1px)}
    .result{display:none;margin-top:18px;border:1px solid rgba(88,213,201,.5);background:rgba(7,31,42,.72);border-radius:20px;padding:20px;text-align:center}.result.show{display:block}.result .small{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}.result .day{font-size:21px;font-weight:800;margin-top:7px}.result .ready{font-size:clamp(37px,11vw,54px);line-height:1.08;color:var(--accent);font-weight:900;letter-spacing:-.04em;margin:4px 0 8px}.result .details{color:#c6d6e1}.warning{color:var(--danger);font-size:14px;margin-top:10px;display:none}
    footer{text-align:center;color:#7f9aad;font-size:12px;margin-top:18px}
    @media (max-width:360px){.card{padding:16px}.time-grid{gap:6px}input,select{padding:0 9px}}
  </style>
</head>
<body>
<main>
  <header><div class="icon">♨️</div><h1>Bake Time Calculator</h1><p>Know exactly when your bake will be ready.</p></header>
  <section class="card">
    <div class="field"><label for="startDate">Start date</label><input id="startDate" type="date"></div>
    <div class="field"><span class="label">Start time</span><div class="time-grid"><select id="startHour" aria-label="Hour"></select><select id="startMinute" aria-label="Minute"></select><select id="meridiem" aria-label="AM or PM"><option>AM</option><option>PM</option></select></div></div>
    <div class="field"><span class="label">Bake duration</span><div class="duration-grid"><div><input id="durationHours" type="number" min="0" max="999" step="1" value="16" inputmode="numeric" aria-label="Duration hours"></div><div><input id="durationMinutes" type="number" min="0" max="59" step="1" value="0" inputmode="numeric" aria-label="Duration minutes"></div></div><div class="quick" aria-label="Common durations"><button type="button" data-hours="8">8 hours</button><button type="button" data-hours="12">12 hours</button><button type="button" data-hours="16">16 hours</button><button type="button" data-hours="24">24 hours</button></div></div>
    <div class="field"><label for="temperature">Temperature (optional)</label><input id="temperature" type="number" inputmode="decimal" placeholder="Example: 85"><div class="quick"><button type="button" data-temp-unit="°C">°C</button><button type="button" data-temp-unit="°F">°F</button></div></div>
    <button class="calculate" id="calculate" type="button">Calculate ready time</button>
    <div class="warning" id="warning" role="alert"></div>
    <div class="result" id="result" aria-live="polite"><div class="small">Bake will be ready</div><div class="day" id="readyDay"></div><div class="ready" id="readyTime"></div><div class="details" id="readyDetails"></div></div>
  </section>
  <footer>Tip: In Safari, tap Share → Add to Home Screen.</footer>
</main>
<script>
  const $=id=>document.getElementById(id);let tempUnit='°C';
  for(let h=1;h<=12;h++) $('startHour').add(new Option(String(h),String(h)));
  for(let m=0;m<60;m+=5) $('startMinute').add(new Option(String(m).padStart(2,'0'),String(m)));
  function setNow(){const n=new Date(),m=Math.round(n.getMinutes()/5)*5; if(m===60)n.setHours(n.getHours()+1,0);else n.setMinutes(m);$('startDate').value=[n.getFullYear(),String(n.getMonth()+1).padStart(2,'0'),String(n.getDate()).padStart(2,'0')].join('-');const h=n.getHours();$('startHour').value=String(h%12||12);$('startMinute').value=String(n.getMinutes());$('meridiem').value=h>=12?'PM':'AM'}
  setNow();
  document.querySelectorAll('[data-hours]').forEach(b=>b.onclick=()=>{$('durationHours').value=b.dataset.hours;$('durationMinutes').value=0});
  document.querySelectorAll('[data-temp-unit]').forEach(b=>b.onclick=()=>{tempUnit=b.dataset.tempUnit;document.querySelectorAll('[data-temp-unit]').forEach(x=>x.style.borderColor=x===b?'var(--accent)':'var(--line)')});document.querySelector('[data-temp-unit="°C"]').click();
  function calculate(){
    $('warning').style.display='none';const date=$('startDate').value,hours=Number($('durationHours').value),minutes=Number($('durationMinutes').value),hour12=Number($('startHour').value),minute=Number($('startMinute').value);
    if(!date||!Number.isFinite(hours)||!Number.isFinite(minutes)||hours<0||minutes<0||minutes>59||(hours===0&&minutes===0)){showError('Enter a valid bake duration.');return}
    let hour=hour12%12+($('meridiem').value==='PM'?12:0);const [y,mo,d]=date.split('-').map(Number);const start=new Date(y,mo-1,d,hour,minute);const ready=new Date(start.getTime()+(hours*60+minutes)*60000);
    if(Number.isNaN(ready.getTime())){showError('Check the start date and time.');return}
    $('readyDay').textContent=ready.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:start.getFullYear()!==ready.getFullYear()?'numeric':undefined});$('readyTime').textContent=ready.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
    const temp=$('temperature').value.trim();$('readyDetails').textContent=`Started ${start.toLocaleDateString(undefined,{month:'short',day:'numeric'})} at ${start.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})} • ${hours} hr ${minutes} min${temp?' • '+temp+tempUnit:''}`;$('result').classList.add('show');$('result').scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  function showError(message){$('warning').textContent=message;$('warning').style.display='block';$('result').classList.remove('show')}
  $('calculate').onclick=calculate;document.addEventListener('keydown',e=>{if(e.key==='Enter')calculate()});
</script>
</body>
</html>
